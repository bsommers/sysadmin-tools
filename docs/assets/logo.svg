      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hero-grid-minor" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
    <pattern id="hero-grid-major" width="96" height="96" patternUnits="userSpaceOnUse">
      <rect width="96" height="96" fill="url(#hero-grid-minor)"/>
      <path d="M 48 0 L 48 96 M 0 48 L 96 48" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.16"/>
      <circle cx="48" cy="48" r="1.8" fill="#00e5ff" fill-opacity="0.38"/>
    </pattern>
    <filter id="hero-glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hero-glow-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.0" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" fill="url(#hero-bg)"/>
  <rect width="1200" height="360" fill="url(#hero-grid-major)"/>
  <rect width="1200" height="360" fill="url(#hero-core-glow)"/>
