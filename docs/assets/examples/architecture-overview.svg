<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" width="1120" height="440" role="img" aria-label="sysadmin-tools architecture overview">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070f"/>
      <stop offset="52%" stop-color="#081022"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>
    <radialGradient id="arch-core-glow" cx="50%" cy="48%" r="56%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#04070f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="arch-emblem-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#00e5ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arch-accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#00e5ff" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="arch-grid-minor" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
    <pattern id="arch-grid-major" width="96" height="96" patternUnits="userSpaceOnUse">
      <rect width="96" height="96" fill="url(#arch-grid-minor)"/>
      <path d="M 48 0 L 48 96 M 0 48 L 96 48" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.16"/>
      <circle cx="48" cy="48" r="1.8" fill="#00e5ff" fill-opacity="0.38"/>
    </pattern>
    <filter id="arch-glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="arch-glow-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.0" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1120" height="440" fill="url(#arch-bg)"/>
  <rect width="1120" height="440" fill="url(#arch-grid-major)"/>
  <rect width="1120" height="440" fill="url(#arch-core-glow)"/>
  <rect x="10" y="10" width="1100" height="420" rx="12" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.45"/>
  <g fill="none" stroke="#00e5ff" stroke-width="2.0" stroke-linecap="square">
    <path d="M 10.0 28.0 L 10.0 10.0 L 28.0 10.0"/>
    <path d="M 1092.0 10.0 L 1110.0 10.0 L 1110.0 28.0"/>
    <path d="M 10.0 412.0 L 10.0 430.0 L 28.0 430.0"/>
    <path d="M 1092.0 430.0 L 1110.0 430.0 L 1110.0 412.0"/>
  </g>

  <!-- Header -->
