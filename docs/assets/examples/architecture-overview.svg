    <circle cx="56" cy="316" r="3.5" fill="#00ff9d"/>
    <text x="68" y="320" fill="#f0f6fc" font-family="'Cascadia Code', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">sys-disk-hogs</text>
    <text x="54" y="337" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5">One-FS mount &amp; cache scanner</text>
    <rect x="42" y="354" width="276" height="46" rx="7" fill="#050b18" stroke="#ff2a85" stroke-width="1.2" stroke-opacity="0.75"/>
    <circle cx="56" cy="370" r="3.5" fill="#ff2a85"/>
    <text x="68" y="374" fill="#f0f6fc" font-family="'Cascadia Code', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">sys-crash-triage</text>
    <text x="54" y="391" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5">Reboot, panic, MCE &amp; GPU logs</text>
  </g>

