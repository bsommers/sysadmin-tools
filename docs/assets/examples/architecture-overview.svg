    <circle cx="56" cy="154" r="3.5" fill="#00ff9d"/>
    <text x="68" y="158" fill="#f0f6fc" font-family="'Cascadia Code', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">sys-investigate</text>
    <text x="54" y="175" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5">Stall, I/O, PSI, GPU, PID triage</text>
