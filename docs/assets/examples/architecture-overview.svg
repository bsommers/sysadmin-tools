  <text x="48" y="42" fill="#f0f6fc" font-family="'Cascadia Code', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="800" letter-spacing="1.4">SYSADMIN-TOOLS // ARCHITECTURE OVERVIEW</text>
  <text x="1092" y="41" text-anchor="end" fill="#5eead4" font-family="'Cascadia Code', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="0.8">PYTHON 3.10+ STDLIB · ZERO THIRD-PARTY DEPS</text>
  <rect x="28" y="58" width="1064" height="1.5" fill="url(#arch-accent-line)"/>

