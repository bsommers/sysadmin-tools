<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="sys-net-watch icon">
  <defs>
    <pattern id="ic-net-watch-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.14"/>
    </pattern>
    <clipPath id="ic-net-watch-clip">
      <rect x="4" y="4" width="56" height="56" rx="12"/>
    </clipPath>
    <filter id="ic-net-watch-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#070d1c"/>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#ic-net-watch-grid)" clip-path="url(#ic-net-watch-clip)"/>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="#00e5ff" stroke-width="1.75"/>
  <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="20" y1="20" x2="44" y2="20" stroke="#38bdf8" stroke-opacity="0.75"/>
    <line x1="20" y1="44" x2="44" y2="44" stroke="#38bdf8" stroke-opacity="0.75"/>
    <line x1="18" y1="22" x2="18" y2="42" stroke="#00e5ff" stroke-opacity="0.7"/>
    <line x1="46" y1="22" x2="46" y2="42" stroke="#00e5ff" stroke-opacity="0.7"/>
    <path d="M 24 28 L 40 28 M 36 24 L 40 28 L 36 32" stroke="#00e5ff" filter="url(#ic-net-watch-glow)"/>
    <path d="M 40 36 L 24 36 M 28 32 L 24 36 L 28 40" stroke="#00ff9d" filter="url(#ic-net-watch-glow)"/>
    <circle cx="18" cy="20" r="3.5" fill="#070d1c" stroke="#00e5ff"/>
    <circle cx="46" cy="20" r="3.5" fill="#070d1c" stroke="#00e5ff"/>
    <circle cx="18" cy="44" r="3.5" fill="#070d1c" stroke="#38bdf8"/>
    <circle cx="46" cy="44" r="3.5" fill="#070d1c" stroke="#38bdf8"/>
    <circle cx="32" cy="14" r="2.2" fill="#00ff9d" stroke="none" filter="url(#ic-net-watch-glow)"/>
  </g>
</svg>
