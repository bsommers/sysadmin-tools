<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="sys-systemd-watch icon">
  <defs>
    <pattern id="ic-systemd-watch-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.14"/>
    </pattern>
    <clipPath id="ic-systemd-watch-clip">
      <rect x="4" y="4" width="56" height="56" rx="12"/>
    </clipPath>
    <filter id="ic-systemd-watch-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#070d1c"/>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#ic-systemd-watch-grid)" clip-path="url(#ic-systemd-watch-clip)"/>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="#00e5ff" stroke-width="1.75"/>
  <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="24" y="12" width="16" height="9" rx="2" fill="#0b1428" stroke="#00e5ff"/>
    <path d="M 32 21 L 32 27 M 19 27 L 45 27 M 19 27 L 19 32 M 45 27 L 45 32" stroke="#38bdf8"/>
    <rect x="12" y="32" width="14" height="9" rx="2" fill="#070d1c" stroke="#00e5ff"/>
    <rect x="38" y="32" width="14" height="9" rx="2" fill="#070d1c" stroke="#ffb800"/>
    <rect x="13" y="47" width="38" height="5" rx="2" fill="#0b1428" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="14.5" y="48.5" width="24" height="2" rx="1" fill="#ffb800" stroke="none" filter="url(#ic-systemd-watch-glow)"/>
  </g>
</svg>
