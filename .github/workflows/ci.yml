name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "*.md"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned commit SHAs verified via `gh api repos/OWNER/REPO/commits/TAG -q .sha`.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Run verification suite
        run: |
          echo "::group::verify.sh"
          ./scripts/verify.sh || {
            for log in target/verify/*.log; do
              echo "--- ${log} ---"
              tail -n 80 "$log" || true
            done
            echo "::endgroup::"
            exit 1
          }
          echo "::endgroup::"

      - name: Check installer dry-run
        run: ./scripts/install.sh --dry-run
