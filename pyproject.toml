[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysadmin-tools"
version = "0.1.0"
description = "Zero-dependency Linux sysadmin investigation and diagnostics CLIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sys-investigate = "sysadmin_tools.sys_investigate:main"

[tool.setuptools.packages.find]
where = ["src"]
